# Free Supabase projects pause after 7 days without database activity. One read every 3 days keeps the demo project up.
name: supabase keepalive
on:
  schedule: [{cron: "17 9 */3 * *"}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/call_sites?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
