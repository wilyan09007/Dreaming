[project]
name = "dreaming"
version = "0.0.0"
description = "A runtime that learns a model of every call your agent makes, then stops making the ones it can predict."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "numpy>=2.0",
  "scipy>=1.14",   # one function: the Clopper-Pearson bound (scipy.stats.beta.ppf)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
openai = ["openai>=1.50", "httpx>=0.27"]
student = ["sentence-transformers>=3.0", "huggingface_hub>=0.30"]
api = ["fastapi>=0.115", "httpx>=0.27"]  # connectors/proxy.py only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreaming"]
