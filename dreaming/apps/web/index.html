<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreaming developer view</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d22; --muted: #666672; --line: #d8d8e0; --accent: #6a4fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16161a; --fg: #ececf1; --muted: #9a9aa6; --line: #34343c; --accent: #a99bff; } }
  body { margin: 0 auto; max-width: 72rem; padding: 1rem 16px 3rem; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  h1 { font-size: 1.1rem; margin: 0; }
  h2 { font-size: .8rem; margin: 1.5rem 0 .4rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  small, th { color: var(--muted); font-weight: normal; }
  #errors { background: var(--fg); color: var(--bg); padding: .5rem .75rem; margin: .75rem 0; white-space: pre-line; overflow-wrap: anywhere; }
  .bar { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center; margin: .6rem 0; }
  button { font: inherit; padding: .2rem .8rem; border: 1px solid var(--accent); background: none; color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  input { accent-color: var(--accent); }
  #metrics { display: flex; flex-wrap: wrap; gap: .5rem 2rem; }
  #metrics div { display: flex; flex-direction: column; }
  #metrics b { font-size: 1.25rem; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .25rem 1rem .25rem 0; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
  #sites td:nth-child(4) { white-space: normal; min-width: 20rem; }
  #replay { white-space: pre-wrap; margin: .5rem 0 0; overflow-wrap: anywhere; }
  #feed { list-style: none; padding: 0; margin: 0; max-height: 15rem; overflow-y: auto; }
  #feed li { border-bottom: 1px solid var(--line); padding: .15rem 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>dreaming <small>developer view of the page contract (apps/web/README.md) · <span id="mode">connecting</span></small></h1>
<div id="errors" hidden></div>

<p id="batch"></p>
<div class="bar">
  <button id="run">run 2,000</button>
  <button id="pause" disabled>pause</button>
  <label>mistakes allowed <input id="budget" type="range" min="1" max="10" step="1" value="5"> <output id="budget-out">5%</output></label>
  <label title="flips the mock vendor API's fault switch; a row says down once the runtime has detected it"><input id="unplug" type="checkbox" disabled> unplug vendor API</label>
  <span id="msg"></span>
</div>

<h2>now</h2>
<div id="metrics"></div>

<h2>call sites</h2>
<div class="scroll"><table>
  <thead><tr><th>site</th><th>phase</th><th>rows / calibration / predicted</th><th>promise</th><th>cost per call awake → dreaming</th><th>audit errors / audits</th></tr></thead>
  <tbody id="sites"></tbody>
</table></div>

<h2>last 10 runs</h2>
<div class="scroll"><table>
  <thead><tr><th>run</th><th>cost</th><th>latency</th><th>status</th><th>replayable</th><th>down</th><th></th></tr></thead>
  <tbody id="runs"></tbody>
</table></div>
<pre id="replay"></pre>

<h2>events</h2>
<ol id="feed"></ol>
<script type="module" src="./app.js"></script>
</body>
</html>
