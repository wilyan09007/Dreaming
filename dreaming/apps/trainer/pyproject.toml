[project]
name = "dreaming-trainer"
version = "0.0.0"
description = "Modal jobs: embed rows, fit predictors, certify, write weights by hash"
requires-python = ">=3.12"
dependencies = [
  "dreaming[postgres,student]",
  "modal>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreaming_trainer"]
