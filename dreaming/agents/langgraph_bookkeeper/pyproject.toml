[project]
name = "langgraph-bookkeeper"
version = "0.0.0"
description = "The same workflow on LangGraph through the proxy, for mission 6"
requires-python = ">=3.12"
dependencies = [
  "dreaming",
  "langgraph>=0.4",
  "langchain-openai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_bookkeeper"]
