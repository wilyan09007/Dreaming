<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dreaming logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
:root{--ink:#2B2B33;--paper:#FFFEFB;--dot:#DCD8E4;--purple:#6A4FD8;--muted:#5C5A66}
html,body{margin:0;height:100%;overflow:hidden}
body{background-color:var(--paper);background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);background-size:26px 26px;
  color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;display:grid;place-items:center}
.blob{position:absolute;filter:blur(26px);opacity:0;transition:opacity 1.2s ease}
.go .blob{opacity:.55}
.mark{display:flex;align-items:center;gap:34px;transform:translateY(-30px)}
.cloud{width:300px;height:238px;transform:scale(.2) rotate(-12deg);opacity:0}
.go .cloud{animation:pop .75s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:none;opacity:1}}
.z{opacity:0;transform:translate(-8px,10px)}
.go .z1{animation:zz .5s .55s ease-out forwards}.go .z2{animation:zz .5s .75s ease-out forwards}
@keyframes zz{to{opacity:1;transform:none}}
.go .zs{animation:bob 2.4s 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.word{display:flex;flex-direction:column}
.word b{font-family:'Gaegu',cursive;font-weight:700;font-size:200px;line-height:.82;letter-spacing:-.01em}
.word b span{display:inline-block;opacity:0;transform:translateY(30px)}
.go .word b span{animation:up .42s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.under path{stroke-dasharray:60;stroke-dashoffset:60}
.go .under path{animation:draw .22s linear forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tag{position:absolute;left:0;right:0;top:calc(50% + 150px);text-align:center;opacity:0;transform:translateY(12px)}
.go .tag{animation:zz .6s 1.25s ease-out forwards}
.tag h2{font-family:'Gaegu',cursive;font-weight:700;font-size:76px;margin:0;color:var(--purple)}
.tag p{font-size:34px;margin:8px 0 0;color:var(--muted);font-weight:500}
.intro .tag{top:calc(50% + 130px)}
</style>
</head>
<body>
<i class="blob" style="left:6%;top:58%;width:520px;height:340px;border-radius:58% 42% 63% 37%/45% 55% 45% 55%;background:#FFD6E0"></i>
<i class="blob" style="right:4%;top:6%;width:560px;height:320px;border-radius:40% 60% 45% 55%/60% 40% 60% 40%;background:#D4E6FF"></i>
<i class="blob" style="right:22%;bottom:-6%;width:620px;height:300px;border-radius:55% 45% 50% 50%/40% 60% 40% 60%;background:#DDF5E8"></i>
<i class="blob" style="left:24%;top:4%;width:380px;height:200px;border-radius:45% 55% 60% 40%/55% 45% 55% 45%;background:#FFF0C2"></i>
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></svg>
<div class="mark">
  <svg class="cloud" viewBox="0 0 58 46" style="filter:url(#rough)">
    <path d="M12 38h30a9 9 0 0 0 1.5-17.9A13 13 0 0 0 18.6 17 10 10 0 0 0 12 38z" fill="#EDE7FF" stroke="#2B2B33" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M20 29q2.5 2.4 5 0M30 29q2.5 2.4 5 0" fill="none" stroke="#2B2B33" stroke-width="2" stroke-linecap="round"/>
    <g class="zs"><path class="z z1" d="M44 4h6l-6 7h6" fill="none" stroke="#6A4FD8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="z z2" d="M51 13h4l-4 5h4" fill="none" stroke="#6A4FD8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>
  <div class="word">
    <b id="w"></b>
    <svg class="under" width="660" height="40" viewBox="0 0 128 8">
      <path d="M2 5 Q12 1 22 5" fill="none" stroke="#FF8A80" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 5 Q34 1 44 5" fill="none" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
      <path d="M46 5 Q56 1 66 5" fill="none" stroke="#7BD8B4" stroke-width="3" stroke-linecap="round"/>
      <path d="M68 5 Q78 1 88 5" fill="none" stroke="#7FB7FF" stroke-width="3" stroke-linecap="round"/>
      <path d="M90 5 Q100 1 110 5" fill="none" stroke="#B39DFF" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
</div>
<div class="tag" id="tag"></div>
<script>
const outro = location.hash === '#outro';
document.body.classList.add(outro ? 'outro' : 'intro');
document.getElementById('w').innerHTML = [...'dreaming'].map((c, i) => `<span style="animation-delay:${0.28 + i * 0.05}s">${c}</span>`).join('');
document.querySelectorAll('.under path').forEach((p, i) => (p.style.animationDelay = 0.72 + i * 0.12 + 's'));
document.getElementById('tag').innerHTML = outro
  ? '<h2>keep on dreaming</h2><p>dreaming-demo.fly.dev</p>'
  : '<p>small models that learn your workflows</p>';
window.play = () => document.body.classList.add('go');
if (location.search.includes('autoplay')) play();
</script>
</body>
</html>
