[project]
name = "quickbooks"
version = "0.0.0"
description = "Intuit's QuickBooks benchmark: the three sites, the data loader (runs inside the campaign's prepare_site), the baselines"
requires-python = ">=3.12"
dependencies = [
  "dreaming",
  "huggingface_hub>=0.30",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickbooks"]
