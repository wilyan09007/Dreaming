[project]
name = "bookkeeper"
version = "0.0.0"
description = "The demo workflow: steps, mock tools, ledger generator, uAgent front door for ASI:One"
requires-python = ">=3.12"
dependencies = [
  "dreaming",
  "httpx>=0.27",
  "uagents>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeper"]
